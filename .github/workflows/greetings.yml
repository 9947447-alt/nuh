name: Greetings

on:
  pull_request_target:
    types:
      - opened
  issues:
    types:
      - opened

jobs:
  greeting:
    name: Greet First-Time Contributors
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          issue_message: "Thanks for opening your first issue! We will review it shortly."
          pr_message: "Thanks for your first pull request! Please make sure CI checks pass."
